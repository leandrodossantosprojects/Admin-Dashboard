
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gradiente para el Control -->
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Gradiente Chispa/Creador -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Base Circular con Borde -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#334155" stroke-width="8"/>

  <!-- Cuerpo del Control de Videojuego -->
  <path d="M160 180h192c35 0 64 29 64 64v32c0 44-36 80-80 80-18 0-35-6-48-17l-22-19h-20l-22 19c-13 11-30 17-48 17-44 0-80-36-80-80v-32c0-35 29-64 64-64z" 
        fill="url(#controllerGrad)"/>

  <!-- D-Pad (Direccionales) -->
  <path d="M160 220v16h-16v16h16v16h16v-16h16v-16h-16v-16z" fill="#0f172a"/>

  <!-- Botones de Acción -->
  <circle cx="336" cy="236" r="10" fill="#0f172a"/>
  <circle cx="360" cy="252" r="10" fill="#0f172a"/>
  <circle cx="312" cy="252" r="10" fill="#0f172a"/>
  <circle cx="336" cy="268" r="10" fill="#0f172a"/>

  <!-- Chispa Creativa (Varita/Creación) -->
  <path d="M380 120 l12 28 l28 12 l-28 12 l-12 28 l-12-28 l-28-12 l28-12 z" fill="url(#sparkGrad)"/>
  <circle cx="130" cy="150" r="8" fill="#f43f5e"/>
  <circle cx="390" cy="360" r="12" fill="#38bdf8"/>
</svg>
